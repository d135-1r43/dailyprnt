<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Daily</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background-color: #000;
            color: #fff;
            min-height: 100vh;
            padding: 2rem 1.5rem;
            line-height: 1.6;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            padding-bottom: 2rem;
            border-bottom: 1px solid #333;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 200;
            letter-spacing: 0.5rem;
            text-transform: uppercase;
        }

        header p {
            font-size: 0.75rem;
            color: #666;
            margin-top: 0.5rem;
            letter-spacing: 0.2rem;
        }

        .card {
            margin-bottom: 3rem;
            padding: 2rem 0;
            border-bottom: 1px solid #222;
        }

        .card:last-child {
            border-bottom: none;
        }

        .quote-card blockquote {
            position: relative;
        }

        .quote-card .quote-text {
            font-size: 1.5rem;
            font-weight: 300;
            font-style: italic;
            line-height: 1.8;
            margin-bottom: 1.5rem;
            padding-left: 1.5rem;
            border-left: 2px solid #fff;
        }

        .quote-card .quote-author {
            font-size: 0.875rem;
            color: #888;
            text-align: right;
            font-style: normal;
            letter-spacing: 0.1rem;
        }

        .word-card .word-title {
            font-size: 2rem;
            font-weight: 600;
            letter-spacing: 0.05rem;
            margin-bottom: 0.5rem;
        }

        .word-card .word-pronunciation {
            font-size: 1rem;
            color: #666;
            font-style: italic;
            margin-bottom: 0.25rem;
        }

        .word-card .word-pos {
            font-size: 0.75rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.15rem;
            margin-bottom: 1.5rem;
        }

        .word-card .word-definition {
            font-size: 1.125rem;
            font-weight: 300;
            line-height: 1.7;
            margin-bottom: 1.5rem;
        }

        .word-card .word-example {
            font-size: 0.9375rem;
            color: #aaa;
            font-style: italic;
            padding-left: 1rem;
            border-left: 1px solid #444;
        }
    </style>
</head>
<body>
    <header>
        <h1>Daily</h1>
        <p>{date}</p>
    </header>

    <main>
        {quoteCard}

        {wordCard}
    </main>
</body>
</html>
