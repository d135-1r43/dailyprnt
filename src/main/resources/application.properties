# --- AI ---------------------------------------------------------------------
quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY}
quarkus.langchain4j.openai.timeout=30s
quarkus.langchain4j.openai.chat-model.response-format=json_object

# --- edition ----------------------------------------------------------------
# Enabled modules, in the order they are printed on the strip.
dailyprnt.modules=quote,wordoftheday,weather

dailyprnt.quote.topic=stoicism

dailyprnt.weather.location=Berlin
dailyprnt.weather.latitude=52.52
dailyprnt.weather.longitude=13.405
dailyprnt.weather.timezone=auto

quarkus.rest-client.open-meteo.url=https://api.open-meteo.com
quarkus.rest-client.open-meteo.read-timeout=10000

# --- test -------------------------------------------------------------------
# Tests exercise the edition machinery with their own modules, never the real
# ones, so no upstream API is called and no key is needed.
%test.quarkus.langchain4j.openai.api-key=test-key
%test.dailyprnt.modules=stable,failing
