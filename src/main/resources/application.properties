# --- AI ---------------------------------------------------------------------
quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY}
quarkus.langchain4j.openai.timeout=30s
quarkus.langchain4j.openai.chat-model.response-format=json_object

# --- edition ----------------------------------------------------------------
# Enabled modules, in the order they are printed on the strip.
dailyprnt.modules=woodcut,quote,wordoftheday,weather

dailyprnt.quote.topic=stoicism

# A carved print is already black-on-white line art, so it survives the reduction
# to 1-bit almost untouched. Photographic styles turn to mud at 384 dots.
dailyprnt.woodcut.theme=the natural world
dailyprnt.woodcut.model=gpt-image-1-mini
dailyprnt.woodcut.size=1024x1024
dailyprnt.woodcut.quality=low

dailyprnt.weather.location=Pfaffenhofen an der Ilm
dailyprnt.weather.latitude=48.53053
dailyprnt.weather.longitude=11.505
dailyprnt.weather.timezone=auto

quarkus.rest-client.openai-images.url=https://api.openai.com
# Image generation regularly takes half a minute.
quarkus.rest-client.openai-images.read-timeout=180000

quarkus.rest-client.open-meteo.url=https://api.open-meteo.com
quarkus.rest-client.open-meteo.read-timeout=10000

# --- test -------------------------------------------------------------------
# Tests exercise the edition machinery with their own modules, never the real
# ones, so no upstream API is called and no key is needed.
%test.quarkus.langchain4j.openai.api-key=test-key
%test.dailyprnt.modules=stable,failing
